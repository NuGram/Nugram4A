name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools" \
            "ndk;21.4.7075529" \
            "cmake;3.10.2.4988404"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build afat debug APK
        run: ./gradlew :TMessagesProj_App:assembleAfatDebug

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nugram-afat-debug-apk
          path: |
            TMessagesProj_App/build/outputs/apk/afat/debug/app.apk
            TMessagesProj_App/build/outputs/apk/afat/debug/output-metadata.json
          if-no-files-found: error
